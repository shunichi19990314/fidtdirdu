<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Proxied Site Viewer</title>
    <style>
        body { margin: 0; font-family: system-ui, sans-serif; background: #f0f2f5; }
        #proxy-container { background: white; width: 100%; min-height: 100vh; }
        .loading { text-align: center; padding: 50px; color: #666; }
    </style>
</head>
<body>
    <div id="proxy-container" class="loading">読み込み中...</div>

    <script>
        // 設定
        const WORKER_URL = "https://manga.shunichi-0314.workers.dev/";
        const container = document.getElementById('proxy-container');

        // 初期表示
        initRouter();

        // ブラウザの戻る/進むボタン対応
        window.addEventListener('popstate', () => {
            initRouter(false); // pushStateしない
        });

        async function initRouter(shouldPushState = true) {
            // URLからパスを取得 (?path=/about -> /about)
            const params = new URLSearchParams(window.location.search);
            const path = params.get('path') || '/';
            
            await loadProxiedPage(path, shouldPushState);
        }

        async function loadProxiedPage(path, shouldPushState = true) {
            container.classList.add('loading');
            container.innerHTML = '読み込み中...';

            // 1. URLをRenderのドメインで更新 (History API)
            if (shouldPushState) {
                const newUrl = `${window.location.origin}/?path=${encodeURIComponent(path)}`;
                history.pushState({ path }, '', newUrl);
            }

            try {
                // 2. WorkerからHTMLを取得
                const response = await fetch(WORKER_URL + path);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                let html = await response.text();

                // 3. 【重要】HTML内の「WorkerのURL」を「RenderのURL」に置換
                html = rewriteUrlsForRender(html);

                // 4. DOMに展開
                container.classList.remove('loading');
                container.innerHTML = html;

                // 5. スクリプトタグの再評価（リダイレクトJSなどを実行させる）
                evalScripts(container);

                // 6. ページ内リンクのクリックをインターセプト（SPA遷移化）
                interceptLinks(container);

            } catch (error) {
                console.error("Load failed:", error);
                container.innerText = "サイトの読み込みに失敗しました。";
            }
        }

        // --- ユーティリティ関数 ---

        // HTML内のWorker URLを、RenderのURL（?path=...形式）に置換する
        function rewriteUrlsForRender(html) {
            const workerOrigin = new URL(WORKER_URL).origin;
            const selfOrigin = window.location.origin;
            
            // 正規表現で WorkerのURL (https://worker.../path) を検出
            // 引用符で囲まれたURLをマッチさせる
            const regex = new RegExp(`(["'])${workerOrigin}(/[^"'\s]*)?\\1`, 'g');
            
            return html.replace(regex, (match, quote, path) => {
                const safePath = path || '/';
                // RenderのURL (?path=/...) に書き換え
                return `${quote}${selfOrigin}/?path=${encodeURIComponent(safePath)}${quote}`;
            });
        }

        // スクリプトタグを再評価して実行する
        function evalScripts(root) {
            const scripts = root.querySelectorAll('script');
            scripts.forEach(oldScript => {
                const newScript = document.createElement('script');
                Array.from(oldScript.attributes).forEach(attr => {
                    newScript.setAttribute(attr.name, attr.value);
                });
                newScript.textContent = oldScript.textContent;
                oldScript.parentNode.replaceChild(newScript, oldScript);
            });
        }

        // ページ内のリンククリックを捕捉し、ページリロードなしで遷移させる
        function interceptLinks(root) {
            root.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', (e) => {
                    const href = link.getAttribute('href');
                    // 自分自身のドメイン（Render）へのリンクならインターセプト
                    if (href && href.startsWith(window.location.origin)) {
                        e.preventDefault();
                        const url = new URL(href);
                        const path = url.searchParams.get('path') || '/';
                        loadProxiedPage(path);
                    }
                    // 外部リンクはそのまま遷移させる
                });
            });
        }
    </script>
</body>
</html>
