<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manga Viewer</title>
    <style>
        body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #1a1a1a; color: #fff; }
        #proxy-container { width: 100%; min-height: 100vh; background: #fff; color: #000; }
        .loading { 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; font-size: 1.2rem; color: #888; background: #1a1a1a;
        }
        /* プロキシ先サイトのスタイルが崩れないよう、コンテナ内はリセットしない */
    </style>
</head>
<body>
    <div id="proxy-container" class="loading">サイトを読み込み中...</div>

    <script>
        // 設定
        const WORKER_URL = "https://manga.shunichi-0314.workers.dev";
        const container = document.getElementById('proxy-container');

        // 初期表示
        initRouter();

        // ブラウザの戻る/進むボタン対応
        window.addEventListener('popstate', () => {
            initRouter(false);
        });

        async function initRouter(shouldPushState = true) {
            const params = new URLSearchParams(window.location.search);
            const path = params.get('path') || '/';
            await loadProxiedPage(path, shouldPushState);
        }

        async function loadProxiedPage(path, shouldPushState = true) {
            container.className = 'loading';
            container.innerHTML = 'サイトを読み込み中...';

            // 1. アドレスバーのURLを更新 (SPA化)
            if (shouldPushState) {
                const newUrl = `${window.location.origin}/?path=${encodeURIComponent(path)}`;
                history.pushState({ path }, '', newUrl);
            }

            try {
                // 2. WorkerからHTMLを取得
                const response = await fetch(WORKER_URL + path);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                let html = await response.text();

                // 3. 【核心】HTML内の「WorkerのURL」を「RenderのURL」に置換
                html = rewriteUrlsForRender(html);

                // 4. DOMに展開
                container.className = '';
                container.innerHTML = html;

                // 5. スクリプトタグの再評価（リダイレクトJSや動的読み込みを実行）
                evalScripts(container);

                // 6. ページ内リンクのクリックをインターセプト（ページ遷移を乗っ取る）
                interceptLinks(container);

            } catch (error) {
                console.error("Load failed:", error);
                container.className = 'loading';
                container.innerHTML = `
                    <div style="text-align:center; padding: 50px;">
                        <h2>読み込みに失敗しました</h2>
                        <p>${error.message}</p>
                        <p style="font-size:0.9rem; color:#666;">
                            ※ ターゲットサイトがCloudflare等のボット保護によりアクセスを拒否している可能性があります。
                        </p>
                    </div>
                `;
            }
        }

        // --- ユーティリティ関数 ---

        function rewriteUrlsForRender(html) {
            const workerOrigin = WORKER_URL;
            const selfOrigin = window.location.origin;
            
            // "https://manga.shunichi-0314.workers.dev/path" または '...' を検出
            const regex = new RegExp(`(["'])${workerOrigin}(/[^"'\s]*)?\\1`, 'g');
            
            return html.replace(regex, (match, quote, path) => {
                const safePath = path || '/';
                return `${quote}${selfOrigin}/?path=${encodeURIComponent(safePath)}${quote}`;
            });
        }

        function evalScripts(root) {
            const scripts = root.querySelectorAll('script');
            scripts.forEach(oldScript => {
                const newScript = document.createElement('script');
                Array.from(oldScript.attributes).forEach(attr => {
                    newScript.setAttribute(attr.name, attr.value);
                });
                newScript.textContent = oldScript.textContent;
                oldScript.parentNode.replaceChild(newScript, oldScript);
            });
        }

        function interceptLinks(root) {
            root.addEventListener('click', (e) => {
                const link = e.target.closest('a');
                if (!link) return;
                
                const href = link.getAttribute('href');
                // 自分自身のドメイン（Render）へのリンクならインターセプト
                if (href && href.startsWith(window.location.origin)) {
                    e.preventDefault();
                    const url = new URL(href);
                    const path = url.searchParams.get('path') || '/';
                    loadProxiedPage(path);
                }
            });
        }
    </script>
</body>
</html>
