<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manga Viewer</title>
    <style>
        body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #1a1a1a; color: #fff; }
        #proxy-container { width: 100%; min-height: 100vh; background: #fff; color: #000; }
        .loading { 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; font-size: 1.2rem; color: #888; background: #1a1a1a;
        }
        .error-box {
            text-align:center; padding: 50px; color: #333;
        }
        .error-box h2 { color: #c00; }
        .error-box ul { text-align: left; display: inline-block; color: #666; }
    </style>
</head>
<body>
    <div id="proxy-container" class="loading">サイトを読み込み中...</div>

    <script>
        const WORKER_URL = "https://manga.shunichi-0314.workers.dev";
        const container = document.getElementById('proxy-container');

        window.addEventListener('popstate', () => {
            initRouter(false);
        });

        async function initRouter(shouldPushState = true) {
            const params = new URLSearchParams(window.location.search);
            const path = params.get('path') || '/';
            await loadProxiedPage(path, shouldPushState);
        }

        async function loadProxiedPage(path, shouldPushState = true) {
            container.className = 'loading';
            container.innerHTML = 'サイトを読み込み中...';

            if (shouldPushState) {
                const newUrl = `${window.location.origin}/?path=${encodeURIComponent(path)}`;
                history.pushState({ path }, '', newUrl);
            }

            try {
                // 【修正点】new URL() を使用してスラッシュの重複を防止
                const targetFetchUrl = new URL(path, WORKER_URL).toString();
                console.log('Fetching:', targetFetchUrl);
                
                const response = await fetch(targetFetchUrl, {
                    method: 'GET',
                    headers: {
                        'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
                    }
                });
                
                console.log('Response status:', response.status);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const html = await response.text();
                console.log('Received HTML length:', html.length);

                // HTML内のWorker URLをRenderのURLに置換
                const rewrittenHtml = rewriteUrlsForRender(html);
                
                container.className = '';
                container.innerHTML = rewrittenHtml;

                evalScripts(container);
                interceptLinks(container);

            } catch (error) {
                console.error("Load failed:", error);
                container.className = 'loading';
                container.innerHTML = `
                    <div class="error-box">
                        <h2>読み込みに失敗しました</h2>
                        <p><strong>${error.message}</strong></p>
                        <p style="font-size:0.9rem; margin-top: 20px;">
                            詳細はブラウザのコンソール（F12キー）を確認してください。
                        </p>
                        <div style="margin-top: 30px; padding: 20px; background: #f5f5f5; border-radius: 5px;">
                            <h3>考えられる原因:</h3>
                            <ul>
                                <li>Workerが正しくデプロイ・保存されていない</li>
                                <li>ターゲットサイト(klmanga.mba)がCloudflare等のボットプロテクションによりアクセスを拒否している</li>
                                <li>ネットワーク接続の問題</li>
                            </ul>
                        </div>
                    </div>
                `;
            }
        }

        function rewriteUrlsForRender(html) {
            const workerOrigin = WORKER_URL;
            const selfOrigin = window.location.origin;
            const regex = new RegExp(`(["'])${workerOrigin}(/[^"'\s]*)?\\1`, 'g');
            
            return html.replace(regex, (match, quote, path) => {
                const safePath = path || '/';
                return `${quote}${selfOrigin}/?path=${encodeURIComponent(safePath)}${quote}`;
            });
        }

        function evalScripts(root) {
            const scripts = root.querySelectorAll('script');
            scripts.forEach(oldScript => {
                const newScript = document.createElement('script');
                Array.from(oldScript.attributes).forEach(attr => {
                    newScript.setAttribute(attr.name, attr.value);
                });
                newScript.textContent = oldScript.textContent;
                oldScript.parentNode.replaceChild(newScript, oldScript);
            });
        }

        function interceptLinks(root) {
            root.addEventListener('click', (e) => {
                const link = e.target.closest('a');
                if (!link) return;
                
                const href = link.getAttribute('href');
                if (href && href.startsWith(window.location.origin)) {
                    e.preventDefault();
                    const url = new URL(href);
                    const path = url.searchParams.get('path') || '/';
                    loadProxiedPage(path);
                }
            });
        }
    </script>
</body>
</html>
